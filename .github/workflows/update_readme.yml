#name: CI

#on: [push, pull_request]

name: Update README

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

#┌───────────── Minute (0 - 59)
#│ ┌─────────── Hour (0 - 23)
#│ │ ┌───────── Day of month (1 - 31)
#│ │ │ ┌─────── Month (1 - 12)
#│ │ │ │ ┌───── Day of week (0 - 6) (Sunday=0)
#* */12 * * *


jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Profile README

    steps:
      - uses: actions/checkout@v2.3.4
      
      - uses: Readme-Workflows/recent-activity@v2.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
