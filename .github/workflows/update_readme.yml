#name: CI

#on: [push, pull_request]

name: Update README

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

#┌───────────── Minute (0 - 59)
#│ ┌─────────── Hour (0 - 23)
#│ │ ┌───────── Day of month (1 - 31)
#│ │ │ ┌─────── Month (1 - 12)
#│ │ │ │ ┌───── Day of week (0 - 6) (Sunday=0)
#* */12 * * *

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate build and check code formatting



    steps:
      - uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci 
      - run: npm run format:check
      - run: npm run build
